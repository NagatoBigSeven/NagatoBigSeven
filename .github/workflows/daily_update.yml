name: Daily Update

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: daily-readme-update
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'

      - name: Validate confirmed-paper updater
        run: python -m unittest discover -s .github/scripts -p 'test_update_papers.py'

      - name: Fetch Hitokoto Quote and Update README
        run: |
          python .github/scripts/update_quote.py

      - name: Fetch arXiv Papers and Update README
        run: |
          python .github/scripts/update_papers.py

      - name: Propose verified README updates
        id: readme-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/daily-readme
          base: main
          add-paths: |
            README.md
            README_CN.md
          commit-message: "chore: refresh quotes and confirmed paper metadata"
          title: "chore: refresh bilingual README quotes and confirmed papers"
          body: |
            Refresh the bilingual README with quotes from their public sources and metadata for owner-confirmed arXiv IDs. Review statuses remain owner-maintained.

            Validation: confirmed-paper regression tests passed; both languages use the same complete arXiv response. Source failures stop publication.
          draft: true

      - name: Record update proposal
        env:
          PR_URL: ${{ steps.readme-pr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            printf 'README update proposal: %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No README changes to propose.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
