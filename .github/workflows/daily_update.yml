name: Daily Update

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch Hitokoto Quote and Update README
        run: |
          python .github/scripts/update_quote.py

      - name: Fetch arXiv Papers and Update README
        run: |
          python .github/scripts/update_papers.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet || (git add README.md README_CN.md && git commit -m "chore: daily update Hitokoto quote and arXiv papers" && git push)
