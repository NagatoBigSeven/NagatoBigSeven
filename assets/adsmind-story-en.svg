<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img"><title>AdsMind</title><style>
.bg{fill:#ECE9E0}.panel{fill:#fff}.ink{fill:#353247}.muted{fill:#514C63}
.accent{fill:#A4ABD6}.line{stroke:#A4ABD6;fill:none}.petal{fill:#A4ABD6;opacity:.25}
@media(prefers-color-scheme:dark){.bg{fill:#22212D}.panel{fill:#302E40}.ink{fill:#fff}.muted{fill:#D8D5E5}}
.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
text{font-family:Segoe UI,Microsoft YaHei,Arial,sans-serif}
</style><rect width="900" height="350" rx="24" class="bg"/><path d="M822 12 Q872 40 862 82 Q806 65 822 12" class="petal"/><text x="24" y="42" class="ink" font-size="25" font-weight="700">AdsMind · RESEARCH STORY</text><rect x="20" y="70" width="272" height="208" rx="16" class="panel"/><circle cx="46" cy="97" r="6" class="accent pulse"/><text x="62" y="103" class="muted" font-size="16" font-weight="700">01 / PROBLEM</text><text x="36" y="145" class="ink" font-size="19" font-weight="700">Where should it bind?</text><text x="36" y="178" class="muted" font-size="16" font-weight="400">Many adsorption configurations.</text><text x="36" y="205" class="muted" font-size="16" font-weight="400">Trial-and-error search is costly.</text><path d="M38 246 H274" class="line" stroke-width="2"/><rect x="314" y="70" width="272" height="208" rx="16" class="panel"/><circle cx="340" cy="97" r="6" class="accent pulse"/><text x="356" y="103" class="muted" font-size="16" font-weight="700">02 / METHOD</text><text x="330" y="145" class="ink" font-size="19" font-weight="700">Propose → relax → verify</text><text x="330" y="178" class="muted" font-size="16" font-weight="400">LLM proposals + MLFF feedback.</text><text x="330" y="205" class="muted" font-size="16" font-weight="400">Revise invalid configurations.</text><path d="M332 246 H568" class="line" stroke-width="2"/><rect x="608" y="70" width="272" height="208" rx="16" class="panel"/><circle cx="634" cy="97" r="6" class="accent pulse"/><text x="650" y="103" class="muted" font-size="16" font-weight="700">03 / RESULT</text><text x="624" y="145" class="ink" font-size="19" font-weight="700">100% / 98.8%</text><text x="624" y="178" class="muted" font-size="16" font-weight="400">AA20 / OCD-GMAE62 success.</text><text x="624" y="205" class="muted" font-size="16" font-weight="400">≈14× fewer MLFF relaxations.</text><path d="M626 246 H862" class="line" stroke-width="2"/><text x="22" y="310" class="muted" font-size="17" font-weight="400">Preprint results · workflow success, not optimality</text><text x="22" y="334" class="muted" font-size="15" font-weight="400">arXiv:2606.19152v1</text></svg>