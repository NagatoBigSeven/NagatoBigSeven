<svg xmlns="http://www.w3.org/2000/svg" width="420" height="680" viewBox="0 0 420 680" role="img"><title>AdsMind</title><style>
.bg{fill:#ECE9E0}.panel{fill:#fff}.ink{fill:#353247}.muted{fill:#514C63}
.accent{fill:#A4ABD6}.line{stroke:#A4ABD6;fill:none}.petal{fill:#A4ABD6;opacity:.25}
@media(prefers-color-scheme:dark){.bg{fill:#22212D}.panel{fill:#302E40}.ink{fill:#fff}.muted{fill:#D8D5E5}}
.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
text{font-family:Segoe UI,Microsoft YaHei,Arial,sans-serif}
</style><rect width="420" height="680" rx="24" class="bg"/><path d="M342 12 Q392 40 382 82 Q326 65 342 12" class="petal"/><text x="24" y="42" class="ink" font-size="25" font-weight="700">AdsMind · 科研叙事</text><rect x="20" y="68" width="380" height="160" rx="16" class="panel"/><circle cx="46" cy="95" r="6" class="accent pulse"/><text x="62" y="101" class="muted" font-size="16" font-weight="700">01 / 问题</text><text x="36" y="143" class="ink" font-size="24" font-weight="700">吸附物应放在哪里？</text><text x="36" y="176" class="muted" font-size="19" font-weight="400">候选吸附构型多，</text><text x="36" y="203" class="muted" font-size="19" font-weight="400">反复试错的搜索成本高。</text><rect x="20" y="248" width="380" height="160" rx="16" class="panel"/><circle cx="46" cy="275" r="6" class="accent pulse"/><text x="62" y="281" class="muted" font-size="16" font-weight="700">02 / 方法</text><text x="36" y="323" class="ink" font-size="24" font-weight="700">提议 → 松弛 → 验证</text><text x="36" y="356" class="muted" font-size="19" font-weight="400">LLM 提议结合 MLFF 反馈，</text><text x="36" y="383" class="muted" font-size="19" font-weight="400">修正不符合约束的构型。</text><rect x="20" y="428" width="380" height="160" rx="16" class="panel"/><circle cx="46" cy="455" r="6" class="accent pulse"/><text x="62" y="461" class="muted" font-size="16" font-weight="700">03 / 结果</text><text x="36" y="503" class="ink" font-size="24" font-weight="700">100% / 98.8%</text><text x="36" y="536" class="muted" font-size="19" font-weight="400">AA20 / OCD-GMAE62 成功率，</text><text x="36" y="563" class="muted" font-size="19" font-weight="400">松弛预算：约为枚举法的 1/14。</text><text x="22" y="640" class="muted" font-size="15" font-weight="400">预印本报告结果 · 工作流成功率不等于全局最优</text><text x="22" y="664" class="muted" font-size="15" font-weight="400">arXiv:2606.19152v1</text></svg>