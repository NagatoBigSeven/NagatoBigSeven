<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img"><title>CatDT</title><style>
.bg{fill:#ECE9E0}.panel{fill:#fff}.ink{fill:#353247}.muted{fill:#514C63}
.accent{fill:#A4ABD6}.line{stroke:#A4ABD6;fill:none}.petal{fill:#A4ABD6;opacity:.25}
@media(prefers-color-scheme:dark){.bg{fill:#22212D}.panel{fill:#302E40}.ink{fill:#fff}.muted{fill:#D8D5E5}}
.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
text{font-family:Segoe UI,Microsoft YaHei,Arial,sans-serif}
</style><rect width="900" height="350" rx="24" class="bg"/><path d="M822 12 Q872 40 862 82 Q806 65 822 12" class="petal"/><text x="24" y="42" class="ink" font-size="25" font-weight="700">CatDT · 科研叙事</text><rect x="20" y="70" width="272" height="208" rx="16" class="panel"/><circle cx="46" cy="97" r="6" class="accent pulse"/><text x="62" y="103" class="muted" font-size="16" font-weight="700">01 / 问题</text><text x="36" y="145" class="ink" font-size="22" font-weight="700">如何串联催化研究？</text><text x="36" y="178" class="muted" font-size="16" font-weight="400">从表面到反应路径与微观动力学，</text><text x="36" y="205" class="muted" font-size="16" font-weight="400">协调多种科学工具。</text><path d="M38 246 H274" class="line" stroke-width="2"/><rect x="314" y="70" width="272" height="208" rx="16" class="panel"/><circle cx="340" cy="97" r="6" class="accent pulse"/><text x="356" y="103" class="muted" font-size="16" font-weight="700">02 / 方法</text><text x="330" y="145" class="ink" font-size="22" font-weight="700">多智能体数字孪生</text><text x="330" y="178" class="muted" font-size="16" font-weight="400">专用智能体协作，</text><text x="330" y="205" class="muted" font-size="16" font-weight="400">结合记忆与工作流反馈自演化。</text><path d="M332 246 H568" class="line" stroke-width="2"/><rect x="608" y="70" width="272" height="208" rx="16" class="panel"/><circle cx="634" cy="97" r="6" class="accent pulse"/><text x="650" y="103" class="muted" font-size="16" font-weight="700">03 / 结果</text><text x="624" y="145" class="ink" font-size="22" font-weight="700">41% → 84%</text><text x="624" y="178" class="muted" font-size="16" font-weight="400">能垒计算成功率提升，</text><text x="624" y="205" class="muted" font-size="16" font-weight="400">在 600 个催化表面上评估。</text><path d="M626 246 H862" class="line" stroke-width="2"/><text x="22" y="310" class="muted" font-size="17" font-weight="400">预印本 v2 · 结合记忆的强化循环</text><text x="22" y="334" class="muted" font-size="15" font-weight="400">arXiv:2606.05050v2</text></svg>