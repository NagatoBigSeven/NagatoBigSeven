</style><rect width="900" height="230" rx="24" class="bg"/><path d="M822 12 Q872 40 862 82 Q806 65 822 12" class="petal"/><text x="24" y="38" class="ink" font-size="23" font-weight="700">ONE MORE CANDIDATE</text><rect x="20" y="62" width="272" height="88" rx="16" class="panel"/><text x="36" y="89" class="muted" font-size="15" font-weight="700">AGENT</text><text x="36" y="124" class="ink" font-size="18" font-weight="700">One more candidate?</text><rect x="314" y="62" width="272" height="88" rx="16" class="panel"/><text x="330" y="89" class="muted" font-size="15" font-weight="700">VERIFIER</text><text x="330" y="124" class="ink" font-size="18" font-weight="700">Check the constraints.</text><rect x="608" y="62" width="272" height="88" rx="16" class="panel"/><text x="624" y="89" class="muted" font-size="15" font-weight="700">DEVELOPER</text><text x="624" y="124" class="ink" font-size="18" font-weight="700">Save the provenance.</text><text x="24" y="206" class="muted" font-size="16" font-weight="400">Original vignette · illustrative dialogue</text></svg>