<svg xmlns="http://www.w3.org/2000/svg" width="420" height="680" viewBox="0 0 420 680" role="img"><title>CatDT</title><style>
.bg{fill:#ECE9E0}.panel{fill:#fff}.ink{fill:#353247}.muted{fill:#514C63}
.accent{fill:#A4ABD6}.line{stroke:#A4ABD6;fill:none}.petal{fill:#A4ABD6;opacity:.25}
@media(prefers-color-scheme:dark){.bg{fill:#22212D}.panel{fill:#302E40}.ink{fill:#fff}.muted{fill:#D8D5E5}}
.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
text{font-family:Segoe UI,Microsoft YaHei,Arial,sans-serif}
</style><rect width="420" height="680" rx="24" class="bg"/><path d="M342 12 Q392 40 382 82 Q326 65 342 12" class="petal"/><text x="24" y="42" class="ink" font-size="25" font-weight="700">CatDT · 科研叙事</text><rect x="20" y="68" width="380" height="160" rx="16" class="panel"/><circle cx="46" cy="95" r="6" class="accent pulse"/><text x="62" y="101" class="muted" font-size="16" font-weight="700">01 / 问题</text><text x="36" y="143" class="ink" font-size="24" font-weight="700">如何串联催化研究？</text><text x="36" y="176" class="muted" font-size="19" font-weight="400">从表面到反应路径与微观动力学，</text><text x="36" y="203" class="muted" font-size="19" font-weight="400">协调多种科学工具。</text><rect x="20" y="248" width="380" height="160" rx="16" class="panel"/><circle cx="46" cy="275" r="6" class="accent pulse"/><text x="62" y="281" class="muted" font-size="16" font-weight="700">02 / 方法</text><text x="36" y="323" class="ink" font-size="24" font-weight="700">多智能体数字孪生</text><text x="36" y="356" class="muted" font-size="19" font-weight="400">专用智能体协作，</text><text x="36" y="383" class="muted" font-size="19" font-weight="400">结合记忆与工作流反馈自演化。</text><rect x="20" y="428" width="380" height="160" rx="16" class="panel"/><circle cx="46" cy="455" r="6" class="accent pulse"/><text x="62" y="461" class="muted" font-size="16" font-weight="700">03 / 结果</text><text x="36" y="503" class="ink" font-size="24" font-weight="700">41% → 84%</text><text x="36" y="536" class="muted" font-size="19" font-weight="400">能垒计算成功率提升，</text><text x="36" y="563" class="muted" font-size="19" font-weight="400">在 600 个催化表面上评估。</text><text x="22" y="640" class="muted" font-size="15" font-weight="400">预印本 v2 · 结合记忆的强化循环</text><text x="22" y="664" class="muted" font-size="15" font-weight="400">arXiv:2606.05050v2</text></svg>